<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <title>Linki</title>

  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Linki" />

  <style>
    :root{
      --bg-top:#263b69;
      --bg-bottom:#0b1220;
      --panel:rgba(13,20,37,0.78);
      --panel-2:rgba(255,255,255,0.07);
      --panel-3:rgba(255,255,255,0.10);
      --line:rgba(255,255,255,0.11);
      --text:#f8fafc;
      --muted:#b2bfd4;
      --blue:#2563eb;
      --blue2:#60a5fa;
      --danger:#ef4444;
      --danger2:#f87171;
      --green:#22c55e;
      --orange:#f59e0b;
      --shadow:0 16px 40px rgba(0,0,0,0.35);
      --radius-xl:26px;
      --radius-lg:20px;
      --radius-md:16px;
      --radius-sm:12px;
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top center, rgba(96,165,250,0.25), transparent 28%),
        linear-gradient(180deg,var(--bg-top),var(--bg-bottom) 48%);
      overscroll-behavior:none;
    }

    body{
      padding:calc(8px + var(--safe-top)) 12px calc(16px + var(--safe-bottom));
    }

    .app{
      max-width:860px;
      margin:0 auto;
    }

    .hero{
      margin:2px 4px 12px;
    }

    .hero-title{
      font-size:28px;
      font-weight:850;
      letter-spacing:-0.02em;
      line-height:1.05;
      margin:0;
    }

    .hero-sub{
      margin-top:6px;
      color:var(--muted);
      font-size:13px;
    }

    .shell,
    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:28px;
      backdrop-filter:blur(14px);
      box-shadow:var(--shadow);
    }

    .shell{
      padding:12px;
      margin-bottom:12px;
    }

    .toolbar{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    .search{
      width:100%;
      border:none;
      outline:none;
      border-radius:18px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.08);
      color:#fff;
      padding:14px 16px;
      font-size:16px;
    }

    .search::placeholder{
      color:#cbd5e1;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    button{
      border:none;
      border-radius:16px;
      color:#fff;
      font-size:15px;
      font-weight:780;
      padding:12px 14px;
      box-shadow:none;
    }

    .btn-primary{
      background:linear-gradient(180deg,var(--blue2),var(--blue));
      box-shadow:0 8px 20px rgba(37,99,235,0.30);
    }

    .btn-soft{
      background:rgba(255,255,255,0.10);
      border:1px solid rgba(255,255,255,0.08);
    }

    .btn-danger{
      background:linear-gradient(180deg,var(--danger2),var(--danger));
      box-shadow:0 8px 18px rgba(239,68,68,0.28);
    }

    .btn-green{
      background:linear-gradient(180deg,#4ade80,var(--green));
      box-shadow:0 8px 18px rgba(34,197,94,0.26);
    }

    .btn-orange{
      background:linear-gradient(180deg,#fbbf24,var(--orange));
      box-shadow:0 8px 18px rgba(245,158,11,0.24);
    }

    .btn-full{
      width:100%;
    }

    .tabs-wrap{
      margin-bottom:12px;
    }

    .tabs-title{
      font-size:13px;
      color:var(--muted);
      margin:0 0 8px 4px;
    }

    .group-tabs,
    .subgroup-tabs{
      display:flex;
      gap:10px;
      overflow-x:auto;
      overflow-y:hidden;
      scrollbar-width:none;
      padding:2px;
      touch-action:pan-x;
    }

    .group-tabs::-webkit-scrollbar,
    .subgroup-tabs::-webkit-scrollbar{
      display:none;
    }

    .group-tab,
    .subgroup-tab{
      position:relative;
      flex:0 0 auto;
      min-width:92px;
      max-width:220px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.08);
      color:#fff;
      padding:11px 15px;
      font-size:15px;
      font-weight:760;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      touch-action:none;
      user-select:none;
      transform:translateZ(0);
      transition:transform 0.16s ease, opacity 0.16s ease;
    }

    .group-tab.active,
    .subgroup-tab.active{
      background:linear-gradient(180deg,var(--blue2),var(--blue));
      box-shadow:0 8px 18px rgba(37,99,235,0.30);
    }

    .panel{
      padding:14px;
    }

    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      margin-bottom:12px;
    }

    .title-block{
      min-width:0;
    }

    .panel-title{
      font-size:24px;
      font-weight:850;
      line-height:1.05;
      margin:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .panel-sub{
      margin-top:5px;
      color:var(--muted);
      font-size:14px;
    }

    .subgroup-bar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-bottom:12px;
    }

    .link-list{
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:20px;
      position:relative;
    }

    .link-item{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;
      min-height:66px;
      width:100%;
      padding:12px;
      border-radius:20px;
      background:var(--panel-2);
      border:1px solid rgba(255,255,255,0.10);
      touch-action:none;
      user-select:none;
      transition:transform 0.16s ease, opacity 0.16s ease, background 0.16s ease;
      transform:translateZ(0);
    }

    .main-hit{
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
      gap:12px;
      min-height:42px;
    }

    .favicon{
      width:22px;
      height:22px;
      border-radius:6px;
      flex:0 0 auto;
      background:rgba(255,255,255,0.10);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:12px;
      font-weight:800;
      color:#dbeafe;
      overflow:hidden;
    }

    .favicon img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .link-title{
      flex:1;
      min-width:0;
      font-size:18px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .menu-wrap{
      position:relative;
      flex:0 0 auto;
    }

    .menu-btn{
      width:42px;
      height:42px;
      padding:0;
      border-radius:14px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.08);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      line-height:1;
    }

    .menu-btn span{
      transform:translateY(-1px);
      letter-spacing:1px;
    }

    .dropdown{
      position:absolute;
      top:calc(100% + 8px);
      right:0;
      width:210px;
      display:none;
      overflow:hidden;
      border-radius:16px;
      background:#162036;
      border:1px solid rgba(255,255,255,0.10);
      box-shadow:0 20px 40px rgba(0,0,0,0.36);
      z-index:60;
    }

    .dropdown.open{
      display:block;
    }

    .dropdown button{
      width:100%;
      text-align:left;
      background:transparent;
      border-radius:0;
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      font-weight:700;
    }

    .dropdown button:last-child{
      border-bottom:none;
    }

    .danger-text{
      color:#fda4af;
    }

    .empty{
      color:var(--muted);
      text-align:center;
      font-size:15px;
      padding:18px 10px;
    }

    .hint{
      margin-top:12px;
      color:var(--muted);
      text-align:center;
      font-size:13px;
      line-height:1.45;
    }

    .drag-layer{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:9999;
    }

    .drag-clone{
      position:absolute;
      left:0;
      top:0;
      width:var(--clone-width);
      border-radius:20px;
      background:rgba(37,52,82,0.98);
      border:1px solid rgba(147,197,253,0.85);
      box-shadow:0 20px 42px rgba(0,0,0,0.38);
      opacity:0.98;
      transform:translate3d(0,0,0) scale(1.02);
      will-change:transform;
    }

    .drag-clone.tab{
      border-radius:999px;
      padding:11px 15px;
      color:#fff;
      font-size:15px;
      font-weight:760;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      background:linear-gradient(180deg,var(--blue2),var(--blue));
    }

    .drag-clone.link{
      padding:12px;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .placeholder{
      border:1px dashed rgba(147,197,253,0.55);
      background:rgba(96,165,250,0.12);
      border-radius:20px;
      transition:all 0.14s ease;
    }

    .placeholder.tab{
      border-radius:999px;
      flex:0 0 auto;
    }

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(2,6,23,0.66);
      backdrop-filter:blur(4px);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:200;
      padding-bottom:var(--safe-bottom);
    }

    .modal-backdrop.show{
      display:flex;
    }

    .modal{
      width:100%;
      max-width:860px;
      background:#0f172a;
      border:1px solid rgba(255,255,255,0.08);
      border-radius:24px 24px 0 0;
      padding:18px 16px 20px;
      box-shadow:0 -10px 36px rgba(0,0,0,0.36);
      max-height:88vh;
      overflow:auto;
    }

    .modal h3{
      margin:2px 0 14px;
      font-size:22px;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:12px;
    }

    .field label{
      font-size:14px;
      font-weight:680;
      color:#cbd5e1;
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      outline:none;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.06);
      color:#fff;
      padding:13px 14px;
      font-size:16px;
      font-family:inherit;
    }

    .field textarea{
      min-height:180px;
      resize:vertical;
      line-height:1.5;
    }

    .modal-actions{
      display:flex;
      gap:10px;
      margin-top:14px;
      flex-wrap:wrap;
    }

    .modal-actions button{
      flex:1 1 140px;
    }

    .section-note{
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
      margin-top:-2px;
      margin-bottom:10px;
    }

    .mini-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:6px;
    }

    .pill{
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.08);
      color:#fff;
      font-size:13px;
      font-weight:700;
    }

    @media (min-width:768px){
      body{
        padding:18px;
      }

      .toolbar{
        grid-template-columns:1fr auto;
        align-items:center;
      }

      .toolbar .search{
        grid-column:1 / -1;
      }

      .modal-backdrop{
        align-items:center;
        padding:18px;
      }

      .modal{
        border-radius:24px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <p class="hero-title">Moje linki</p>
      <div class="hero-sub">Widok mobilny, grupy, podgrupy i przeciąganie palcem</div>
    </div>

    <div class="shell">
      <div class="tabs-wrap">
        <div class="tabs-title">Grupy</div>
        <div id="groupTabs" class="group-tabs"></div>
      </div>

      <div class="toolbar">
        <input id="searchInput" class="search" type="text" placeholder="Szukaj po tytule..." />
        <div class="row">
          <button id="addLinkBtn" class="btn-primary">Dodaj link</button>
          <button id="addGroupBtn" class="btn-soft">Dodaj grupę</button>
          <button id="editGroupBtn" class="btn-soft">Edytuj grupę</button>
          <button id="jsonBtn" class="btn-orange">JSON</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="title-block">
          <div id="currentGroupTitle" class="panel-title">Grupa</div>
          <div id="currentSubInfo" class="panel-sub">Podgrupa</div>
        </div>
      </div>

      <div class="subgroup-bar">
        <button id="addSubgroupBtn" class="btn-soft">Dodaj podgrupę</button>
        <button id="editSubgroupBtn" class="btn-soft">Edytuj podgrupę</button>
      </div>

      <div class="tabs-wrap">
        <div class="tabs-title">Podgrupy</div>
        <div id="subgroupTabs" class="subgroup-tabs"></div>
      </div>

      <div id="linkList" class="link-list"></div>

      <div class="hint">
        Kliknij link, aby otworzyć. Przytrzymaj dłużej i przesuń palcem, aby zmienić kolejność grup, podgrup lub linków.
      </div>
    </div>
  </div>

  <div id="dragLayer" class="drag-layer"></div>

  <div id="modalBackdrop" class="modal-backdrop">
    <div id="modalContent" class="modal"></div>
  </div>

  <script>
    const DATA_URL = 'data.json';
    const STORAGE_KEY = 'mobile_links_app_v3';

    const fallbackData = {
      groups: [
        {
          id: uid(),
          name: 'Ogólne',
          subgroups: [
            {
              id: uid(),
              name: 'Bez podgrupy',
              links: [
                { id: uid(), title: 'Lista uczniów', url: 'https://example.com' },
                { id: uid(), title: 'Dzwonki', url: 'https://example.org' }
              ]
            }
          ]
        }
      ],
      currentGroupId: null,
      currentSubgroupId: null
    };

    let state = structuredClone(fallbackData);

    const els = {
      groupTabs: document.getElementById('groupTabs'),
      subgroupTabs: document.getElementById('subgroupTabs'),
      linkList: document.getElementById('linkList'),
      currentGroupTitle: document.getElementById('currentGroupTitle'),
      currentSubInfo: document.getElementById('currentSubInfo'),
      searchInput: document.getElementById('searchInput'),
      addLinkBtn: document.getElementById('addLinkBtn'),
      addGroupBtn: document.getElementById('addGroupBtn'),
      editGroupBtn: document.getElementById('editGroupBtn'),
      addSubgroupBtn: document.getElementById('addSubgroupBtn'),
      editSubgroupBtn: document.getElementById('editSubgroupBtn'),
      jsonBtn: document.getElementById('jsonBtn'),
      modalBackdrop: document.getElementById('modalBackdrop'),
      modalContent: document.getElementById('modalContent'),
      dragLayer: document.getElementById('dragLayer')
    };

    init();

    async function init() {
      bindBaseEvents();
      await loadInitialData();
      ensureCurrentPointers();
      render();
    }

    function bindBaseEvents() {
      els.searchInput.addEventListener('input', render);
      els.addLinkBtn.addEventListener('click', openAddLinkModal);
      els.addGroupBtn.addEventListener('click', openAddGroupModal);
      els.editGroupBtn.addEventListener('click', openEditGroupModal);
      els.addSubgroupBtn.addEventListener('click', openAddSubgroupModal);
      els.editSubgroupBtn.addEventListener('click', openEditSubgroupModal);
      els.jsonBtn.addEventListener('click', openJsonModal);

      els.modalBackdrop.addEventListener('click', (e) => {
        if (e.target === els.modalBackdrop) closeModal();
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.menu-wrap')) closeAllMenus();
      });
    }

    async function loadInitialData() {
      const local = loadLocalState();
      if (local) {
        state = normalizeData(local);
        return;
      }

      try {
        const res = await fetch(DATA_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('Brak data.json');
        const data = await res.json();
        state = normalizeData(data);
        saveLocalState();
      } catch {
        state = normalizeData(fallbackData);
        saveLocalState();
      }
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function saveLocalState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function normalizeData(input) {
      const data = input && typeof input === 'object' ? structuredClone(input) : structuredClone(fallbackData);

      if (!Array.isArray(data.groups) || !data.groups.length) {
        data.groups = structuredClone(fallbackData.groups);
      }

      data.groups = data.groups.map(group => ({
        id: group.id || uid(),
        name: group.name || 'Grupa',
        subgroups: normalizeSubgroups(group.subgroups, group.links)
      }));

      data.currentGroupId = data.currentGroupId || data.groups[0].id;

      const currentGroup = data.groups.find(g => g.id === data.currentGroupId) || data.groups[0];
      data.currentGroupId = currentGroup.id;
      data.currentSubgroupId = data.currentSubgroupId || currentGroup.subgroups[0].id;

      const currentSub = currentGroup.subgroups.find(s => s.id === data.currentSubgroupId) || currentGroup.subgroups[0];
      data.currentSubgroupId = currentSub.id;

      return data;
    }

    function normalizeSubgroups(subgroups, legacyLinks) {
      if (Array.isArray(subgroups) && subgroups.length) {
        return subgroups.map(sub => ({
          id: sub.id || uid(),
          name: sub.name || 'Podgrupa',
          links: Array.isArray(sub.links) ? sub.links.map(normalizeLink) : []
        }));
      }

      const links = Array.isArray(legacyLinks) ? legacyLinks.map(normalizeLink) : [];
      return [{
        id: uid(),
        name: 'Bez podgrupy',
        links
      }];
    }

    function normalizeLink(link) {
      return {
        id: link.id || uid(),
        title: link.title || 'Bez tytułu',
        url: link.url || ''
      };
    }

    function ensureCurrentPointers() {
      if (!state.groups.length) {
        state.groups = structuredClone(fallbackData.groups);
      }

      let group = getCurrentGroup();
      if (!group) {
        state.currentGroupId = state.groups[0].id;
        group = state.groups[0];
      }

      if (!group.subgroups.length) {
        group.subgroups = [{
          id: uid(),
          name: 'Bez podgrupy',
          links: []
        }];
      }

      let subgroup = getCurrentSubgroup();
      if (!subgroup || !group.subgroups.some(s => s.id === state.currentSubgroupId)) {
        state.currentSubgroupId = group.subgroups[0].id;
      }
    }

    function getCurrentGroup() {
      return state.groups.find(g => g.id === state.currentGroupId) || null;
    }

    function getCurrentSubgroup() {
      const group = getCurrentGroup();
      if (!group) return null;
      return group.subgroups.find(s => s.id === state.currentSubgroupId) || null;
    }

    function render() {
      ensureCurrentPointers();
      renderGroups();
      renderSubgroups();
      renderLinks();
      saveLocalState();
    }

    function renderGroups() {
      els.groupTabs.innerHTML = '';

      state.groups.forEach(group => {
        const btn = document.createElement('button');
        btn.className = 'group-tab' + (group.id === state.currentGroupId ? ' active' : '');
        btn.textContent = group.name;
        btn.dataset.id = group.id;

        btn.addEventListener('click', (e) => {
          if (btn.dataset.dragging === '1') {
            e.preventDefault();
            return;
          }
          state.currentGroupId = group.id;
          const current = getCurrentGroup();
          state.currentSubgroupId = current.subgroups[0]?.id || null;
          render();
        });

        attachTouchSortable({
          element: btn,
          type: 'group',
          container: els.groupTabs,
          onCommit: reorderGroups
        });

        els.groupTabs.appendChild(btn);
      });
    }

    function renderSubgroups() {
      els.subgroupTabs.innerHTML = '';

      const group = getCurrentGroup();
      if (!group) return;

      els.currentGroupTitle.textContent = group.name;

      group.subgroups.forEach(subgroup => {
        const btn = document.createElement('button');
        btn.className = 'subgroup-tab' + (subgroup.id === state.currentSubgroupId ? ' active' : '');
        btn.textContent = subgroup.name;
        btn.dataset.id = subgroup.id;

        btn.addEventListener('click', (e) => {
          if (btn.dataset.dragging === '1') {
            e.preventDefault();
            return;
          }
          state.currentSubgroupId = subgroup.id;
          render();
        });

        attachTouchSortable({
          element: btn,
          type: 'subgroup',
          container: els.subgroupTabs,
          onCommit: reorderSubgroups
        });

        els.subgroupTabs.appendChild(btn);
      });
    }

    function renderLinks() {
      const group = getCurrentGroup();
      const subgroup = getCurrentSubgroup();

      if (!group || !subgroup) {
        els.linkList.innerHTML = '<div class="empty">Brak danych.</div>';
        return;
      }

      els.currentSubInfo.textContent = `${subgroup.name} • ${subgroup.links.length} linków`;

      const q = els.searchInput.value.trim().toLowerCase();
      const links = subgroup.links.filter(link => link.title.toLowerCase().includes(q));

      els.linkList.innerHTML = '';

      if (!links.length) {
        els.linkList.innerHTML = `<div class="empty">${q ? 'Brak wyników.' : 'Brak linków w tej podgrupie.'}</div>`;
        return;
      }

      links.forEach(link => {
        const item = document.createElement('div');
        item.className = 'link-item';

    function createFavicon(link) {
      const div = document.createElement('div');
      div.className = 'favicon';

      const normalized = normalizeUrl(link.url);
      if (!normalized) {
        div.textContent = (link.title || '?').trim().charAt(0).toUpperCase() || '?';
        return div;
      }

      try {
        const url = new URL(normalized);
        const img = document.createElement('img');
        img.alt = '';
        img.src = `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(url.hostname)}`;
        img.onerror = () => {
          div.innerHTML = '';
          div.textContent = url.hostname.charAt(0).toUpperCase();
        };
        div.appendChild(img);
      } catch {
        div.textContent = (link.title || '?').trim().charAt(0).toUpperCase() || '?';
      }

      return div;
    }

    function attachLinkOpen(main, item, url) {
      let sx = 0;
      let sy = 0;
      let moved = false;

      main.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        sx = t.clientX;
        sy = t.clientY;
        moved = false;
      }, { passive: true });

      main.addEventListener('touchmove', (e) => {
        const t = e.touches[0];
        if (Math.abs(t.clientX - sx) > 8 || Math.abs(t.clientY - sy) > 8) {
          moved = true;
        }
      }, { passive: true });

      main.addEventListener('click', (e) => {
        if (item.dataset.dragging === '1') {
          e.preventDefault();
          return;
        }
        if (moved) return;
        const normalized = normalizeUrl(url);
        if (normalized) {
          window.open(normalized, '_blank', 'noopener,noreferrer');
        }
      });
    }

    function exportState() {
      return {
        groups: state.groups,
        currentGroupId: state.currentGroupId,
        currentSubgroupId: state.currentSubgroupId
      };
    }

    function findLinkById(linkId) {
      for (const group of state.groups) {
        for (const subgroup of group.subgroups) {
          const link = subgroup.links.find(l => l.id === linkId);
          if (link) return { group, subgroup, link };
        }
      }
      return null;
    }

    function reorderGroups(dragId, targetId, place) {
      const from = state.groups.findIndex(g => g.id === dragId);
      const to = state.groups.findIndex(g => g.id === targetId);
      if (from === -1 || to === -1 || from === to) return;
      const [moved] = state.groups.splice(from, 1);
      const newIndex = place === 'before' ? to : to + (from < to ? 0 : 1);
      state.groups.splice(Math.max(0, Math.min(newIndex, state.groups.length)), 0, moved);
      render();
    }

    function reorderSubgroups(dragId, targetId, place) {
      const group = getCurrentGroup();
      if (!group) return;
      const from = group.subgroups.findIndex(s => s.id === dragId);
      const to = group.subgroups.findIndex(s => s.id === targetId);
      if (from === -1 || to === -1 || from === to) return;
      const [moved] = group.subgroups.splice(from, 1);
      const newIndex = place === 'before' ? to : to + (from < to ? 0 : 1);
      group.subgroups.splice(Math.max(0, Math.min(newIndex, group.subgroups.length)), 0, moved);
      render();
    }

    function reorderLinks(dragId, targetId, place) {
      const subgroup = getCurrentSubgroup();
      if (!subgroup) return;

      if (els.searchInput.value.trim()) {
        alert('Aby zmieniać kolejność linków, wyczyść wyszukiwanie.');
        return;
      }

      const from = subgroup.links.findIndex(l => l.id === dragId);
      const to = subgroup.links.findIndex(l => l.id === targetId);
      if (from === -1 || to === -1 || from === to) return;

      const [moved] = subgroup.links.splice(from, 1);
      const newIndex = place === 'before' ? to : to + (from < to ? 0 : 1);
      subgroup.links.splice(Math.max(0, Math.min(newIndex, subgroup.links.length)), 0, moved);
      render();
    }

    function normalizeUrl(url) {
      try {
        const prepared = /^(https?:)?\/\//i.test(url) ? url : `https://${url}`;
        return new URL(prepared).href;
      } catch {
        return null;
      }
    }

    function uid() {
      return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now());
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    function attachTouchSortable({ element, type, container, onCommit }) {
      let holdTimer = null;
      let dragging = false;
      let pointerId = null;
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let currentY = 0;
      let shiftX = 0;
      let shiftY = 0;
      let clone = null;
      let placeholder = null;
      let startRect = null;
      let movedBeforeHold = false;
      let finalTargetId = null;
      let finalPlace = 'after';

      const HOLD_MS = 220;
      const MOVE_CANCEL = 10;

      element.addEventListener('pointerdown', onPointerDown, { passive: true });

      function onPointerDown(e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (e.target.closest('.menu-wrap')) return;
        if (type === 'link' && els.searchInput.value.trim()) return;

        pointerId = e.pointerId;
        startX = e.clientX;
        startY = e.clientY;
        currentX = e.clientX;
        currentY = e.clientY;
        movedBeforeHold = false;
        finalTargetId = null;
        finalPlace = 'after';
        startRect = element.getBoundingClientRect();

        clearTimeout(holdTimer);
        holdTimer = setTimeout(beginDrag, HOLD_MS);

        window.addEventListener('pointermove', onPointerMove, { passive: false });
        window.addEventListener('pointerup', onPointerUp, { passive: false });
        window.addEventListener('pointercancel', onPointerCancel, { passive: false });
      }

      function onPointerMove(e) {
        if (e.pointerId !== pointerId) return;
        currentX = e.clientX;
        currentY = e.clientY;

        if (!dragging) {
          if (Math.abs(currentX - startX) > MOVE_CANCEL || Math.abs(currentY - startY) > MOVE_CANCEL) {
            movedBeforeHold = true;
            clearTimeout(holdTimer);
          }
          return;
        }

        e.preventDefault();
        element.dataset.dragging = '1';
        moveClone(currentX, currentY);
        updatePlaceholderPosition();
        autoScroll();
      }

      function onPointerUp(e) {
        if (e.pointerId !== pointerId) return;
        clearTimeout(holdTimer);

        if (dragging) {
          e.preventDefault();
          finishDrag(true);
        } else {
          cleanup();
          setTimeout(() => { element.dataset.dragging = '0'; }, 0);
        }
      }

      function onPointerCancel(e) {
        if (e.pointerId !== pointerId) return;
        clearTimeout(holdTimer);

        if (dragging) {
          finishDrag(false);
        } else {
          cleanup();
          element.dataset.dragging = '0';
        }
      }

      function beginDrag() {
        if (movedBeforeHold) return;
        dragging = true;
        element.dataset.dragging = '1';
        closeAllMenus();

        if (navigator.vibrate) navigator.vibrate(16);

        placeholder = document.createElement('div');
        placeholder.className = 'placeholder' + (type === 'group' || type === 'subgroup' ? ' tab' : '');
        placeholder.style.height = `${startRect.height}px`;
        placeholder.style.width = `${startRect.width}px`;

        element.parentNode.insertBefore(placeholder, element);
        element.style.visibility = 'hidden';

        clone = buildClone();
        els.dragLayer.innerHTML = '';
        els.dragLayer.appendChild(clone);

        shiftX = startX - startRect.left;
        shiftY = startY - startRect.top;
        moveClone(currentX, currentY);
      }

      function buildClone() {
        const div = document.createElement('div');
        div.className = 'drag-clone ' + (type === 'link' ? 'link' : 'tab');
        div.style.setProperty('--clone-width', `${startRect.width}px`);

        if (type === 'link') {
          const title = element.querySelector('.link-title')?.textContent || '';
          const favEl = element.querySelector('.favicon');
          const fav = favEl ? favEl.cloneNode(true) : document.createElement('div');
          fav.classList.add('favicon');

          const text = document.createElement('div');
          text.className = 'link-title';
          text.textContent = title;

          const menu = document.createElement('div');
          menu.className = 'menu-btn';
          menu.innerHTML = '<span>⋯</span>';

          div.appendChild(fav);
          div.appendChild(text);
          div.appendChild(menu);
        } else {
          div.textContent = element.textContent;
        }

        return div;
      }

      function moveClone(x, y) {
        if (!clone) return;
        clone.style.transform = `translate3d(${x - shiftX}px, ${y - shiftY}px, 0) scale(1.02)`;
      }

      function updatePlaceholderPosition() {
        const siblings = [...container.children].filter(el => el !== element && el !== placeholder);
        if (!siblings.length) return;

        let inserted = false;

        for (const sib of siblings) {
          const rect = sib.getBoundingClientRect();
          if (type === 'group' || type === 'subgroup') {
            const mid = rect.left + rect.width / 2;
            if (currentX < mid) {
              container.insertBefore(placeholder, sib);
              finalTargetId = sib.dataset.id;
              finalPlace = 'before';
              inserted = true;
              break;
            }
          } else {
            const mid = rect.top + rect.height / 2;
            if (currentY < mid) {
              container.insertBefore(placeholder, sib);
              finalTargetId = sib.dataset.id;
              finalPlace = 'before';
              inserted = true;
              break;
            }
          }
        }

        if (!inserted) {
          container.appendChild(placeholder);
          const last = siblings[siblings.length - 1];
          finalTargetId = last?.dataset.id || null;
          finalPlace = 'after';
        }
      }

      function finishDrag(commit) {
        if (clone) clone.remove();
        if (placeholder && placeholder.parentNode) {
          placeholder.parentNode.insertBefore(element, placeholder);
          placeholder.remove();
        }

        element.style.visibility = '';
        const dragId = element.dataset.id;

        cleanup();

        if (commit && finalTargetId && finalTargetId !== dragId) {
          onCommit(dragId, finalTargetId, finalPlace);
        } else {
          render();
        }
      }

      function cleanup() {
        dragging = false;
        pointerId = null;
        clone = null;
        placeholder = null;
        startRect = null;
        clearTimeout(holdTimer);
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('pointercancel', onPointerCancel);
        setTimeout(() => { element.dataset.dragging = '0'; }, 0);
      }

      function autoScroll() {
        const marginY = 90;
        const speedY = 10;
        const vh = window.innerHeight;

        if (currentY < marginY) window.scrollBy(0, -speedY);
        if (currentY > vh - marginY) window.scrollBy(0, speedY);

        if (type === 'group' || type === 'subgroup') {
          const rect = container.getBoundingClientRect();
          if (currentX < rect.left + 50) container.scrollLeft -= 12;
          if (currentX > rect.right - 50) container.scrollLeft += 12;
        }
      }
    }
  </script>
</body>
</html>
