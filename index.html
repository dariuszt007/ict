<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>ICT Linki</title>
            <!-- Link do ładnej ikonki na iPhone'a -->
    <link rel="apple-touch-icon" href="apple-touch-icon1.png" />

  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="ICTサポーター" />

  <style>
    :root{
      --bg-top:#263b69;
      --bg-bottom:#0b1220;
      --panel:rgba(13,20,37,0.78);
      --panel-2:rgba(255,255,255,0.07);
      --line:rgba(255,255,255,0.11);
      --text:#f8fafc;
      --muted:#b2bfd4;
      --blue:#2563eb;
      --blue2:#60a5fa;
      --danger:#ef4444;
      --danger2:#f87171;
      --green:#22c55e;
      --orange:#f59e0b;
      --shadow:0 16px 40px rgba(0,0,0,0.35);
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      min-height:100%;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at top center, rgba(96,165,250,0.25), transparent 28%),
        linear-gradient(180deg,var(--bg-top),var(--bg-bottom) 48%);
      overscroll-behavior-y:auto;
      overscroll-behavior-x:none;
      -webkit-text-size-adjust:100%;
    }

    body{
      padding:calc(8px + var(--safe-top)) 12px calc(16px + var(--safe-bottom));
      overflow-x:hidden;
    }

    .app{
      max-width:860px;
      margin:0 auto;
    }

    .hero{
      margin:2px 4px 12px;
      user-select:none;
      -webkit-user-select:none;
    }

    .hero-title{
      font-size:28px;
      font-weight:850;
      letter-spacing:-0.02em;
      line-height:1.05;
      margin:0;
    }

    .hero-sub{
      margin-top:6px;
      color:var(--muted);
      font-size:13px;
    }

    .shell,
    .panel{
      background:var(--panel);
      border:1px solid var(--line);
      border-radius:28px;
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:var(--shadow);
      overflow:visible;
      position:relative;
    }

    .shell{
      padding:12px;
      margin-bottom:12px;
      z-index:20;
    }

    .panel{
      padding:14px;
      z-index:10;
    }

    .toolbar{
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
      overflow:visible;
      position:relative;
      z-index:40;
    }

    .search{
      width:100%;
      border:none;
      outline:none;
      border-radius:18px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.08);
      color:#fff;
      padding:14px 16px;
      font-size:16px;
      user-select:text;
      -webkit-user-select:text;
      -webkit-touch-callout:default;
    }

    .search::placeholder{
      color:#cbd5e1;
    }

    .top-actions{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      justify-content:flex-start;
      overflow:visible;
      position:relative;
      z-index:50;
    }

    button{
      border:none;
      border-radius:18px;
      color:#fff;
      font-size:15px;
      font-weight:780;
      padding:13px 16px;
      box-shadow:none;
      font-family:inherit;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
      -webkit-user-drag:none;
      touch-action:manipulation;
    }

    .btn-primary{
      background:linear-gradient(180deg,var(--blue2),var(--blue));
      box-shadow:0 8px 20px rgba(37,99,235,0.30);
    }

    .btn-soft{
      background:rgba(255,255,255,0.10);
      border:1px solid rgba(255,255,255,0.08);
    }

    .btn-danger{
      background:linear-gradient(180deg,var(--danger2),var(--danger));
      box-shadow:0 8px 18px rgba(239,68,68,0.28);
    }

    .btn-green{
      background:linear-gradient(180deg,#4ade80,var(--green));
      box-shadow:0 8px 18px rgba(34,197,94,0.26);
    }

    .btn-orange{
      background:linear-gradient(180deg,#fbbf24,var(--orange));
      box-shadow:0 8px 18px rgba(245,158,11,0.24);
    }

    .tabs-wrap{
      margin-bottom:12px;
      overflow:visible;
      position:relative;
      z-index:1;
    }

    .tabs-title{
      font-size:13px;
      color:var(--muted);
      margin:0 0 8px 4px;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    .group-tabs,
    .subgroup-tabs{
      display:flex;
      gap:10px;
      overflow-x:auto;
      overflow-y:visible;
      scrollbar-width:none;
      padding:2px 2px 4px;
      -webkit-overflow-scrolling:touch;
      touch-action:pan-x;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
      scroll-behavior:smooth;
      position:relative;
      z-index:1;
    }

    .group-tabs::-webkit-scrollbar,
    .subgroup-tabs::-webkit-scrollbar{
      display:none;
    }

    .group-tab,
    .subgroup-tab{
      position:relative;
      flex:0 0 auto;
      min-width:92px;
      max-width:220px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.12);
      background:rgba(255,255,255,0.08);
      color:#fff;
      padding:11px 15px;
      font-size:15px;
      font-weight:760;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
      -webkit-user-drag:none;
      transform:translateZ(0);
      transition:transform 0.16s ease, opacity 0.16s ease;
      touch-action:pan-x;
    }

    .group-tab.active,
    .subgroup-tab.active{
      background:linear-gradient(180deg,var(--blue2),var(--blue));
      box-shadow:0 8px 18px rgba(37,99,235,0.30);
    }

    .panel-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      margin-bottom:12px;
      position:relative;
      z-index:1;
    }

    .title-block{
      min-width:0;
      flex:1;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    .panel-title{
      font-size:24px;
      font-weight:850;
      line-height:1.05;
      margin:0;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .panel-sub{
      margin-top:5px;
      color:var(--muted);
      font-size:14px;
    }

    .subgroup-bar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:12px;
      overflow:visible;
      position:relative;
      z-index:60;
    }

    .subgroup-left{
      min-width:0;
      flex:1;
      color:var(--muted);
      font-size:13px;
      padding-left:2px;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    .menu-wrap{
      position:relative;
      flex:0 0 auto;
      z-index:1000;
      overflow:visible;
    }

    .menu-btn{
      width:42px;
      height:42px;
      padding:0;
      border-radius:14px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.08);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      line-height:1;
      touch-action:manipulation;
    }

    .menu-btn span{
      transform:translateY(-1px);
      letter-spacing:1px;
    }

    .dropdown{
      position:absolute;
      top:calc(100% + 8px);
      right:0;
      width:220px;
      display:none;
      overflow:hidden;
      border-radius:16px;
      background:#162036;
      border:1px solid rgba(255,255,255,0.12);
      box-shadow:0 24px 50px rgba(0,0,0,0.50);
      z-index:99999;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
      opacity:0;
      transform:translateY(-4px) scale(0.98);
      transition:opacity 0.16s ease, transform 0.16s ease;
    }

    .dropdown.open{
      display:block;
      opacity:1;
      transform:translateY(0) scale(1);
    }

    .dropdown button{
      width:100%;
      text-align:left;
      background:transparent;
      border-radius:0;
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,0.06);
      font-weight:700;
    }

    .dropdown button:last-child{
      border-bottom:none;
    }

    .link-list{
      display:flex;
      flex-direction:column;
      gap:10px;
      min-height:20px;
      position:relative;
      z-index:1;
      overflow:visible;
    }

    .link-item{
      position:relative;
      display:flex;
      align-items:center;
      gap:12px;
      min-height:66px;
      width:100%;
      padding:12px;
      border-radius:20px;
      background:var(--panel-2);
      border:1px solid rgba(255,255,255,0.10);
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
      -webkit-user-drag:none;
      transition:
        transform 0.18s cubic-bezier(.2,.9,.2,1),
        opacity 0.16s ease,
        background 0.16s ease,
        box-shadow 0.16s ease;
      transform:translateZ(0);
      will-change:transform;
      touch-action:manipulation;
      overflow:visible;
      z-index:1;
    }

    .link-item.menu-open{
      z-index:5000;
    }

    .link-item.sort-animate,
    .group-tab.sort-animate,
    .subgroup-tab.sort-animate{
      transition:transform 0.18s cubic-bezier(.2,.9,.2,1);
    }

    .main-hit{
      flex:1;
      min-width:0;
      display:flex;
      align-items:center;
      gap:12px;
      min-height:42px;
      touch-action:manipulation;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    .favicon{
      width:22px;
      height:22px;
      border-radius:6px;
      flex:0 0 auto;
      background:rgba(255,255,255,0.10);
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:11px;
      font-weight:800;
      color:#fff;
      overflow:hidden;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,0.08);
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    .favicon img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      pointer-events:none;
      user-select:none;
      -webkit-user-select:none;
      -webkit-user-drag:none;
    }

    .link-title{
      flex:1;
      min-width:0;
      font-size:18px;
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    .danger-text{
      color:#fda4af;
    }

    .empty{
      color:var(--muted);
      text-align:center;
      font-size:15px;
      padding:18px 10px;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    .hint{
      margin-top:12px;
      color:var(--muted);
      text-align:center;
      font-size:13px;
      line-height:1.45;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    .drag-layer{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:120000;
    }

    .drag-clone{
      position:absolute;
      left:0;
      top:0;
      width:var(--clone-width);
      border-radius:20px;
      background:rgba(37,52,82,0.98);
      border:1px solid rgba(147,197,253,0.85);
      box-shadow:0 20px 42px rgba(0,0,0,0.38);
      opacity:0.98;
      transform:translate3d(0,0,0) scale(1.02);
      will-change:transform;
      user-select:none;
      -webkit-user-select:none;
      -webkit-touch-callout:none;
    }

    .drag-clone.tab{
      border-radius:999px;
      padding:11px 15px;
      color:#fff;
      font-size:15px;
      font-weight:760;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      background:linear-gradient(180deg,var(--blue2),var(--blue));
    }

    .drag-clone.link{
      padding:12px;
      display:flex;
      align-items:center;
      gap:12px;
    }

    .placeholder{
      border:1px dashed rgba(147,197,253,0.55);
      background:rgba(96,165,250,0.12);
      border-radius:20px;
      transition:all 0.14s ease;
    }

    .placeholder.tab{
      border-radius:999px;
      flex:0 0 auto;
    }

    .hide{
      display:none !important;
    }

    .modal-backdrop{
      position:fixed;
      inset:0;
      background:rgba(2,6,23,0.66);
      backdrop-filter:blur(4px);
      -webkit-backdrop-filter:blur(4px);
      display:none;
      align-items:flex-end;
      justify-content:center;
      z-index:130000;
      padding-bottom:var(--safe-bottom);
    }

    .modal-backdrop.show{
      display:flex;
    }

    .modal{
      width:100%;
      max-width:860px;
      background:#0f172a;
      border:1px solid rgba(255,255,255,0.08);
      border-radius:24px 24px 0 0;
      padding:18px 16px 20px;
      box-shadow:0 -10px 36px rgba(0,0,0,0.36);
      max-height:88vh;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
    }

    .modal h3{
      margin:2px 0 14px;
      font-size:22px;
      user-select:none;
      -webkit-user-select:none;
    }

    .field{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-bottom:12px;
    }

    .field label{
      font-size:14px;
      font-weight:680;
      color:#cbd5e1;
      user-select:none;
      -webkit-user-select:none;
    }

    .field input,
    .field select,
    .field textarea{
      width:100%;
      outline:none;
      border-radius:14px;
      border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.06);
      color:#fff;
      padding:13px 14px;
      font-size:16px;
      font-family:inherit;
    }

    .field textarea{
      min-height:180px;
      resize:vertical;
      line-height:1.5;
      user-select:text;
      -webkit-user-select:text;
      -webkit-touch-callout:default;
    }

    .modal-actions{
      display:flex;
      gap:10px;
      margin-top:14px;
      flex-wrap:wrap;
    }

    .modal-actions button{
      flex:1 1 140px;
    }

    .section-note{
      color:var(--muted);
      font-size:13px;
      line-height:1.45;
      margin-top:-2px;
      margin-bottom:10px;
      user-select:none;
      -webkit-user-select:none;
    }

    .mini-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:6px;
    }

    .pill{
      padding:8px 12px;
      border-radius:999px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.08);
      color:#fff;
      font-size:13px;
      font-weight:700;
      user-select:none;
      -webkit-user-select:none;
    }

    .bulk-help{
      color:var(--muted);
      font-size:13px;
      line-height:1.5;
      margin-top:-2px;
      margin-bottom:8px;
      user-select:none;
      -webkit-user-select:none;
    }

    @media (min-width:768px){
      body{
        padding:18px;
      }

      .toolbar{
        grid-template-columns:1fr;
      }

      .modal-backdrop{
        align-items:center;
        padding:18px;
      }

      .modal{
        border-radius:24px;
      }

      <!-- POCZATEK -->


.action-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  min-width:0;
}

.desktop-label{
  display:inline;
}

.mobile-label{
  display:none;
}

@media (max-width:640px){
  .top-actions{
    display:flex;
    flex-wrap:nowrap;
    gap:8px;
    overflow-x:auto;
    overflow-y:hidden;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }

  .top-actions::-webkit-scrollbar{
    display:none;
  }

  .top-actions .action-btn{
    flex:0 0 auto;
    width:48px;
    height:48px;
    padding:0;
    border-radius:16px;
  }

  .desktop-label{
    display:none;
  }

  .mobile-label{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    font-weight:800;
    line-height:1;
  }
}

    
    <!-- KONIEC -->



      
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="hero">
      <p class="hero-title">Moje linki</p>
      <!--<div class="hero-sub">Widok mobilny, grupy, podgrupy i przeciąganie palcem</div>-->
    </div>

    <div class="shell">
      <div class="tabs-wrap">
        <div class="tabs-title">Grupy</div>
        <div id="groupTabs" class="group-tabs"></div>
      </div>

      <div class="toolbar">
        <input id="searchInput" class="search" type="text" placeholder="Szukaj po tytule..." />

        <div class="top-actions">



          <button id="addLinkBtn" class="btn-primary action-btn" aria-label="Dodaj link" title="Dodaj link">
  <span class="desktop-label">Dodaj link</span>
  <span class="mobile-label">+</span>
</button>

<button id="addManyBtn" class="btn-primary action-btn" aria-label="Dodaj wiele" title="Dodaj wiele">
  <span class="desktop-label">Dodaj wiele</span>
  <span class="mobile-label">≡</span>
</button>

<button id="addGroupBtn" class="btn-primary action-btn" aria-label="Dodaj grupę" title="Dodaj grupę">
  <span class="desktop-label">Dodaj grupę</span>
  <span class="mobile-label">▣</span>
</button>

<button id="editGroupBtn" class="btn-primary action-btn" aria-label="Edytuj grupę" title="Edytuj grupę">
  <span class="desktop-label">Edytuj grupę</span>
  <span class="mobile-label">✎</span>
</button>

<button id="jsonBtn" class="btn-primary action-btn" aria-label="JSON" title="JSON">
  <span class="desktop-label">JSON</span>
  <span class="mobile-label">{}</span>
</button>







          <!--
          <button id="addLinkBtn" class="btn-primary">Dodaj link</button>
          <button id="addManyBtn" class="btn-soft">Dodaj wiele</button>
          <button id="addGroupBtn" class="btn-soft">Dodaj grupę</button>
          <button id="editGroupBtn" class="btn-soft">Edytuj grupę</button>
          <button id="jsonBtn" class="btn-orange">JSON</button>
          -->

      
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-head">
        <div class="title-block">
          <div id="currentGroupTitle" class="panel-title">Grupa</div>
          <div id="currentSubInfo" class="panel-sub">Podgrupa</div>
        </div>
      </div>

      <div class="subgroup-bar">
        <div class="subgroup-left">Podgrupy</div>

        <div id="subgroupMenuWrap" class="menu-wrap">
          <button id="subgroupMenuBtn" class="menu-btn" aria-label="Menu podgrup">
            <span>⋯</span>
          </button>
          <div id="subgroupDropdown" class="dropdown">
            <button id="toggleSubgroupsBtn">Zwiń podgrupy</button>
            <button id="addSubgroupBtn">Dodaj podgrupę</button>
            <button id="editSubgroupBtn">Edytuj podgrupę</button>
          </div>
        </div>
      </div>

      <div id="subgroupsWrap" class="tabs-wrap">
        <div id="subgroupTabs" class="subgroup-tabs"></div>
      </div>

      <div id="linkList" class="link-list"></div>

      <div class="hint">
        Kliknij link, aby otworzyć. Przytrzymaj dłużej i przesuń palcem, aby zmienić kolejność grup, podgrup lub linków.
      </div>
    </div>
  </div>

  <div id="dragLayer" class="drag-layer"></div>

  <div id="modalBackdrop" class="modal-backdrop">
    <div id="modalContent" class="modal"></div>
  </div>

  <script>
    const DATA_URL = 'data.json';
    const STORAGE_KEY = 'mobile_links_big_buttons_v1';
    const OUTSIDE_GROUP_ID = '__outside__';

    const fallbackData = {
      groups: [
        {
          id: uid(),
          name: 'Ogólne',
          collapsedSubgroups: false,
          subgroups: [
            {
              id: uid(),
              name: 'Bez podgrupy',
              links: [
                { id: uid(), title: 'Lista uczniów', url: 'https://example.com' },
                { id: uid(), title: 'Dzwonki', url: 'https://example.org' }
              ]
            }
          ]
        }
      ],
      outsideLinks: [],
      currentGroupId: null,
      currentSubgroupId: null
    };

    let state = structuredClone(fallbackData);

    const els = {
      groupTabs: document.getElementById('groupTabs'),
      subgroupTabs: document.getElementById('subgroupTabs'),
      subgroupsWrap: document.getElementById('subgroupsWrap'),
      linkList: document.getElementById('linkList'),
      currentGroupTitle: document.getElementById('currentGroupTitle'),
      currentSubInfo: document.getElementById('currentSubInfo'),
      searchInput: document.getElementById('searchInput'),

      addLinkBtn: document.getElementById('addLinkBtn'),
      addManyBtn: document.getElementById('addManyBtn'),
      addGroupBtn: document.getElementById('addGroupBtn'),
      editGroupBtn: document.getElementById('editGroupBtn'),
      jsonBtn: document.getElementById('jsonBtn'),

      addSubgroupBtn: document.getElementById('addSubgroupBtn'),
      editSubgroupBtn: document.getElementById('editSubgroupBtn'),
      toggleSubgroupsBtn: document.getElementById('toggleSubgroupsBtn'),
      subgroupMenuBtn: document.getElementById('subgroupMenuBtn'),
      subgroupDropdown: document.getElementById('subgroupDropdown'),
      subgroupMenuWrap: document.getElementById('subgroupMenuWrap'),

      modalBackdrop: document.getElementById('modalBackdrop'),
      modalContent: document.getElementById('modalContent'),
      dragLayer: document.getElementById('dragLayer')
    };

    init();

    async function init() {
      bindBaseEvents();
      await loadInitialData();
      ensureCurrentPointers();
      render();
    }

    function bindBaseEvents() {
      els.searchInput.addEventListener('input', render);

      els.addLinkBtn.addEventListener('click', openAddLinkModal);
      els.addManyBtn.addEventListener('click', openBulkAddModal);
      els.addGroupBtn.addEventListener('click', openAddGroupModal);
      els.editGroupBtn.addEventListener('click', openEditGroupModal);
      els.jsonBtn.addEventListener('click', openJsonModal);

      els.addSubgroupBtn.addEventListener('click', () => {
        closeAllMenus();
        openAddSubgroupModal();
      });

      els.editSubgroupBtn.addEventListener('click', () => {
        closeAllMenus();
        openEditSubgroupModal();
      });

      els.toggleSubgroupsBtn.addEventListener('click', () => {
        closeAllMenus();
        toggleSubgroups();
      });

      els.subgroupMenuBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const isOpen = els.subgroupDropdown.classList.contains('open');
        closeAllMenus();
        if (!isOpen) {
          els.subgroupDropdown.classList.add('open');
        }
      });

      els.modalBackdrop.addEventListener('click', (e) => {
        if (e.target === els.modalBackdrop) closeModal();
      });

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.menu-wrap')) {
          closeAllMenus();
        }
      });

      document.addEventListener('selectstart', (e) => {
        if (e.target.closest('.search, textarea, input, select')) return;
        if (e.target.closest('.group-tab, .subgroup-tab, .link-item, .menu-btn, button')) {
          e.preventDefault();
        }
      });

      document.addEventListener('contextmenu', (e) => {
        if (e.target.closest('.group-tab, .subgroup-tab, .link-item, .menu-btn, button')) {
          e.preventDefault();
        }
      });
    }

    function closeAllMenus() {
      document.querySelectorAll('.dropdown.open').forEach(el => el.classList.remove('open'));
      document.querySelectorAll('.link-item.menu-open').forEach(el => el.classList.remove('menu-open'));
    }

    async function loadInitialData() {
      const local = loadLocalState();
      if (local) {
        state = normalizeData(local);
        return;
      }

      try {
        const res = await fetch(DATA_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('Brak data.json');
        const data = await res.json();
        state = normalizeData(data);
        saveLocalState();
      } catch {
        state = normalizeData(fallbackData);
        saveLocalState();
      }
    }

    function loadLocalState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return null;
        return JSON.parse(raw);
      } catch {
        return null;
      }
    }

    function saveLocalState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function normalizeData(input) {
      const data = input && typeof input === 'object'
        ? structuredClone(input)
        : structuredClone(fallbackData);

      if (!Array.isArray(data.groups) || !data.groups.length) {
        data.groups = structuredClone(fallbackData.groups);
      }

      data.groups = data.groups.map(group => ({
        id: group.id || uid(),
        name: group.name || 'Grupa',
        collapsedSubgroups: !!group.collapsedSubgroups,
        subgroups: normalizeSubgroups(group.subgroups, group.links)
      }));

      data.outsideLinks = Array.isArray(data.outsideLinks)
        ? data.outsideLinks.map(normalizeLink)
        : [];

      data.currentGroupId = data.currentGroupId || data.groups[0].id;
      const currentGroup = data.groups.find(g => g.id === data.currentGroupId) || data.groups[0];
      data.currentGroupId = currentGroup.id;
      data.currentSubgroupId = data.currentSubgroupId || currentGroup.subgroups[0].id;

      const currentSub = currentGroup.subgroups.find(s => s.id === data.currentSubgroupId) || currentGroup.subgroups[0];
      data.currentSubgroupId = currentSub.id;

      return data;
    }

    function normalizeSubgroups(subgroups, legacyLinks) {
      if (Array.isArray(subgroups) && subgroups.length) {
        return subgroups.map(sub => ({
          id: sub.id || uid(),
          name: sub.name || 'Podgrupa',
          links: Array.isArray(sub.links) ? sub.links.map(normalizeLink) : []
        }));
      }

      const links = Array.isArray(legacyLinks) ? legacyLinks.map(normalizeLink) : [];
      return [{
        id: uid(),
        name: 'Bez podgrupy',
        links
      }];
    }

    function normalizeLink(link) {
      return {
        id: link.id || uid(),
        title: link.title || 'Bez tytułu',
        url: link.url || ''
      };
    }

    function ensureCurrentPointers() {
      if (!state.groups.length) {
        state.groups = structuredClone(fallbackData.groups);
      }

      if (state.currentGroupId === OUTSIDE_GROUP_ID && !state.outsideLinks.length) {
        state.currentGroupId = state.groups[0].id;
      }

      let group = getCurrentGroup();
      if (!group && state.currentGroupId !== OUTSIDE_GROUP_ID) {
        state.currentGroupId = state.groups[0].id;
        group = state.groups[0];
      }

      if (state.currentGroupId === OUTSIDE_GROUP_ID) {
        state.currentSubgroupId = null;
        return;
      }

      if (!group.subgroups.length) {
        group.subgroups = [{ id: uid(), name: 'Bez podgrupy', links: [] }];
      }

      let subgroup = getCurrentSubgroup();
      if (!subgroup || !group.subgroups.some(s => s.id === state.currentSubgroupId)) {
        state.currentSubgroupId = group.subgroups[0].id;
      }
    }

    function getCurrentGroup() {
      if (state.currentGroupId === OUTSIDE_GROUP_ID) return null;
      return state.groups.find(g => g.id === state.currentGroupId) || null;
    }

    function getCurrentSubgroup() {
      const group = getCurrentGroup();
      if (!group) return null;
      return group.subgroups.find(s => s.id === state.currentSubgroupId) || null;
    }

    function isOutsideView() {
      return state.currentGroupId === OUTSIDE_GROUP_ID;
    }

    function hasOutsideLinks() {
      return Array.isArray(state.outsideLinks) && state.outsideLinks.length > 0;
    }

    function render() {
      ensureCurrentPointers();
      renderGroups();
      renderSubgroups();
      renderLinks();
      updateToolbarState();
      saveLocalState();
    }

    function updateToolbarState() {
      const outside = isOutsideView();
      const group = getCurrentGroup();

      els.subgroupMenuWrap.classList.toggle('hide', outside);
      els.subgroupsWrap.classList.toggle('hide', outside || !!group?.collapsedSubgroups);

      if (group) {
        els.toggleSubgroupsBtn.textContent = group.collapsedSubgroups ? 'Rozwiń podgrupy' : 'Zwiń podgrupy';
      }
    }

    function renderGroups() {
      els.groupTabs.innerHTML = '';

      state.groups.forEach(group => {
        const btn = document.createElement('button');
        btn.className = 'group-tab sort-animate' + (group.id === state.currentGroupId ? ' active' : '');
        btn.textContent = group.name;
        btn.dataset.id = group.id;

        btn.addEventListener('click', (e) => {
          if (btn.dataset.dragging === '1') {
            e.preventDefault();
            return;
          }
          state.currentGroupId = group.id;
          state.currentSubgroupId = group.subgroups[0]?.id || null;
          render();
        });

        attachTouchSortable({
          element: btn,
          type: 'group',
          container: els.groupTabs,
          onCommit: reorderGroups
        });

        els.groupTabs.appendChild(btn);
      });

      if (hasOutsideLinks()) {
        const btn = document.createElement('button');
        btn.className = 'group-tab sort-animate' + (state.currentGroupId === OUTSIDE_GROUP_ID ? ' active' : '');
        btn.textContent = 'Poza grupami';
        btn.dataset.id = OUTSIDE_GROUP_ID;
        btn.addEventListener('click', () => {
          state.currentGroupId = OUTSIDE_GROUP_ID;
          state.currentSubgroupId = null;
          render();
        });
        els.groupTabs.appendChild(btn);
      }
    }

    function renderSubgroups() {
      els.subgroupTabs.innerHTML = '';

      if (isOutsideView()) {
        els.currentGroupTitle.textContent = 'Poza grupami';
        els.currentSubInfo.textContent = `${state.outsideLinks.length} linków`;
        return;
      }

      const group = getCurrentGroup();
      if (!group) return;

      els.currentGroupTitle.textContent = group.name;

      const subgroup = getCurrentSubgroup();
      els.currentSubInfo.textContent = `${subgroup?.name || 'Podgrupa'} • ${subgroup?.links.length || 0} linków`;

      if (group.collapsedSubgroups) return;

      group.subgroups.forEach(subgroup => {
        const btn = document.createElement('button');
        btn.className = 'subgroup-tab sort-animate' + (subgroup.id === state.currentSubgroupId ? ' active' : '');
        btn.textContent = subgroup.name;
        btn.dataset.id = subgroup.id;

        btn.addEventListener('click', (e) => {
          if (btn.dataset.dragging === '1') {
            e.preventDefault();
            return;
          }
          state.currentSubgroupId = subgroup.id;
          render();
        });

        attachTouchSortable({
          element: btn,
          type: 'subgroup',
          container: els.subgroupTabs,
          onCommit: reorderSubgroups
        });

        els.subgroupTabs.appendChild(btn);
      });
    }

    function renderLinks() {
      let links = [];
      const q = els.searchInput.value.trim().toLowerCase();

      if (isOutsideView()) {
        links = state.outsideLinks.filter(link => link.title.toLowerCase().includes(q));
      } else {
        const subgroup = getCurrentSubgroup();
        if (!subgroup) {
          els.linkList.innerHTML = '<div class="empty">Brak danych.</div>';
          return;
        }
        links = subgroup.links.filter(link => link.title.toLowerCase().includes(q));
      }

      els.linkList.innerHTML = '';

      if (!links.length) {
        els.linkList.innerHTML = `<div class="empty">${q ? 'Brak wyników.' : 'Brak linków.'}</div>`;
        return;
      }

      links.forEach(link => {
        const item = document.createElement('div');
        item.className = 'link-item sort-animate';
        item.dataset.id = link.id;

        const main = document.createElement('div');
        main.className = 'main-hit';

        const favicon = createFavicon(link);
        const title = document.createElement('div');
        title.className = 'link-title';
        title.textContent = link.title;

        main.appendChild(favicon);
        main.appendChild(title);
        attachLinkOpen(main, item, link.url);

        const menuWrap = document.createElement('div');
        menuWrap.className = 'menu-wrap';

        const menuBtn = document.createElement('button');
        menuBtn.className = 'menu-btn';
        menuBtn.setAttribute('aria-label', 'Menu');
        menuBtn.innerHTML = '<span>⋯</span>';

        const dropdown = document.createElement('div');
        dropdown.className = 'dropdown';

        if (!isOutsideView()) {
          const moveBtn = document.createElement('button');
          moveBtn.textContent = 'Przenieś do podgrupy';
          moveBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeAllMenus();
            openMoveLinkModal(link.id);
          });
          dropdown.appendChild(moveBtn);
        }

        const moveGroupBtn = document.createElement('button');
        moveGroupBtn.textContent = 'Przenieś do grupy';
        moveGroupBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeAllMenus();
          openMoveLinkToGroupModal(link.id);
        });

        const duplicateBtn = document.createElement('button');
        duplicateBtn.textContent = 'Duplikuj';
        duplicateBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeAllMenus();
          duplicateLink(link.id);
        });

        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edytuj';
        editBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeAllMenus();
          openEditLinkModal(link.id);
        });

        const removeFromGroupBtn = document.createElement('button');
        removeFromGroupBtn.textContent = 'Przenieś poza grupy';
        removeFromGroupBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeAllMenus();
          moveLinkOutside(link.id);
        });

        const deleteBtn = document.createElement('button');
        deleteBtn.innerHTML = '<span class="danger-text">Usuń</span>';
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          closeAllMenus();
          openDeleteLinkModal(link.id);
        });

        dropdown.appendChild(moveGroupBtn);
        dropdown.appendChild(duplicateBtn);
        dropdown.appendChild(editBtn);

        if (!isOutsideView()) {
          dropdown.appendChild(removeFromGroupBtn);
        }

        dropdown.appendChild(deleteBtn);

        menuBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const wasOpen = dropdown.classList.contains('open');
          closeAllMenus();
          if (!wasOpen) {
            item.classList.add('menu-open');
            dropdown.classList.add('open');
          }
        });

        menuWrap.appendChild(menuBtn);
        menuWrap.appendChild(dropdown);

        item.appendChild(main);
        item.appendChild(menuWrap);

        attachTouchSortable({
          element: item,
          type: 'link',
          container: els.linkList,
          onCommit: reorderLinks
        });

        els.linkList.appendChild(item);
      });
    }

    function createFavicon(link) {
      const div = document.createElement('div');
      div.className = 'favicon';

      const normalized = normalizeUrl(link.url);
      const fallbackText = ((link.title || '?').trim().charAt(0).toUpperCase() || '?');

      if (!normalized) {
        applyFaviconFallback(div, fallbackText);
        return div;
      }

      try {
        const url = new URL(normalized);
        const img = document.createElement('img');
        img.alt = '';
        img.draggable = false;
        img.src = `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(url.hostname)}`;
        img.onerror = () => applyFaviconFallback(div, url.hostname.charAt(0).toUpperCase() || fallbackText, url.hostname);
        div.appendChild(img);
      } catch {
        applyFaviconFallback(div, fallbackText);
      }

      return div;
    }

    function applyFaviconFallback(el, letter, seed = letter) {
      el.innerHTML = '';
      const colors = [
        ['#ef4444', '#f97316'],
        ['#3b82f6', '#06b6d4'],
        ['#8b5cf6', '#ec4899'],
        ['#22c55e', '#14b8a6'],
        ['#f59e0b', '#eab308'],
        ['#6366f1', '#3b82f6']
      ];
      const index = Math.abs(hashString(seed)) % colors.length;
      const [c1, c2] = colors[index];
      el.style.background = `linear-gradient(135deg, ${c1}, ${c2})`;
      el.textContent = letter;
    }

    function hashString(str) {
      let h = 0;
      for (let i = 0; i < str.length; i++) {
        h = ((h << 5) - h) + str.charCodeAt(i);
        h |= 0;
      }
      return h;
    }

    function attachLinkOpen(main, item, url) {
      let sx = 0;
      let sy = 0;
      let moved = false;

      main.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        sx = t.clientX;
        sy = t.clientY;
        moved = false;
      }, { passive: true });

      main.addEventListener('touchmove', (e) => {
        const t = e.touches[0];
        if (Math.abs(t.clientX - sx) > 8 || Math.abs(t.clientY - sy) > 8) {
          moved = true;
        }
      }, { passive: true });

      main.addEventListener('click', (e) => {
        if (item.dataset.dragging === '1') {
          e.preventDefault();
          return;
        }
        if (moved) return;
        const normalized = normalizeUrl(url);
        if (normalized) {
          window.open(normalized, '_blank', 'noopener,noreferrer');
        }
      });
    }

    function openModal(html) {
      els.modalContent.innerHTML = html;
      els.modalBackdrop.classList.add('show');
    }

    function closeModal() {
      els.modalBackdrop.classList.remove('show');
      els.modalContent.innerHTML = '';
    }

    function bindModal(id, event, handler) {
      const el = document.getElementById(id);
      if (el) el.addEventListener(event, handler);
    }

    function toggleSubgroups() {
      const group = getCurrentGroup();
      if (!group) return;
      group.collapsedSubgroups = !group.collapsedSubgroups;
      render();
    }

    function openAddGroupModal() {
      openModal(`

          <label for="groupName">Nazwa grupy</label>

        </div>
        <div class="modal-actions">
          <button id="cancelBtn" class="btn-soft" type="button">Anuluj</button>
          <button id="saveBtn" class="btn-primary" type="button">Zapisz</button>
        </div>
      `);

      bindModal('cancelBtn', 'click', closeModal);
      bindModal('saveBtn', 'click', () => {
        const name = document.getElementById('groupName').value.trim();
        if (!name) return alert('Podaj nazwę grupy.');

        const newGroup = {
          id: uid(),
          name,
          collapsedSubgroups: false,

            id: uid(),
            name: 'Bez podgrupy',

          }]
        };

        state.groups.push(newGroup);
        state.currentGroupId = newGroup.id;
        state.currentSubgroupId = newGroup.subgroups[0].id;

        render();
      });

    function openEditGroupModal() {
      if (isOutsideView()) {
        return alert('Sekcja "Poza grupami" jest automatyczna i pojawia się tylko wtedy, gdy są tam linki.');
      }

        <div class="modal-actions">
          <button id="deleteGroupBtnModal" class="btn-danger" type="button">Usuń grupę</button>
          <button id="cancelBtn" class="btn-soft" type="button">Anuluj</button>
          <button id="saveBtn" class="btn-primary" type="button">Zapisz</button>
        </div>
      `);

      bindModal('cancelBtn', 'click', closeModal);
      bindModal('saveBtn', 'click', () => {
        const name = document.getElementById('groupNameEdit').value.trim();
        if (!name) return alert('Podaj nazwę grupy.');
        group.name = name;
        closeModal();
        render();
      });

      bindModal('deleteGroupBtnModal', 'click', () => {
        if (state.groups.length <= 1) return alert('Musi zostać przynajmniej jedna grupa.');
        state.groups = state.groups.filter(g => g.id !== group.id);
        state.currentGroupId = state.groups[0].id;
        state.currentSubgroupId = state.groups[0].subgroups[0].id;
        closeModal();
        render();
      });

      const group = getCurrentGroup();
      if (!group) return;

      openModal(`
        <h3>Dodaj podgrupę</h3>

          <label for="subgroupName">Nazwa podgrupy</label>

        </div>
      `);

          <button id="saveBtn" class="btn-primary" type="button">Zapisz</button>
        </div>
      `);

      bindModal('cancelBtn', 'click', closeModal);
      bindModal('saveBtn', 'click', () => {
        const name = document.getElementById('subgroupNameEdit').value.trim();
        if (!name) return alert('Podaj nazwę podgrupy.');
        subgroup.name = name;

        render();

      bindModal('deleteSubgroupBtnModal', 'click', () => {

        group.subgroups = group.subgroups.filter(s => s.id !== subgroup.id);
        state.currentSubgroupId = group.subgroups[0].id;

    function openAddLinkModal() {
      openModal(buildLinkModalHtml('Dodaj link', {
        title: '',
        url: '',
        saveText: 'Zapisz'
      }));

      const groupSelect = document.getElementById('linkGroup');
      const subgroupSelect = document.getElementById('linkSubgroup');

      fillGroupAndSubgroupSelects(groupSelect, subgroupSelect, getDefaultModalTarget());

      groupSelect.addEventListener('change', () => {
        fillSubgroupSelectForGroup(subgroupSelect, groupSelect.value, null);
      });

      bindModal('cancelBtn', 'click', closeModal);
      bindModal('saveBtn', 'click', () => {
        const title = document.getElementById('linkTitle').value.trim();
        const url = document.getElementById('linkUrl').value.trim();
        const groupId = groupSelect.value;
        const subgroupId = subgroupSelect.value;

        if (!title || !url) return alert('Uzupełnij tytuł i adres URL.');
        const validUrl = normalizeUrl(url);
        if (!validUrl) return alert('Podaj poprawny adres URL.');

        const newLink = { id: uid(), title, url: validUrl };

        if (groupId === OUTSIDE_GROUP_ID) {
          state.outsideLinks.push(newLink);
          state.currentGroupId = OUTSIDE_GROUP_ID;
          state.currentSubgroupId = null;
        } else {
          const group = state.groups.find(g => g.id === groupId);
          const subgroup = group?.subgroups.find(s => s.id === subgroupId);
          if (!group || !subgroup) return;
          subgroup.links.push(newLink);
          state.currentGroupId = group.id;
          state.currentSubgroupId = subgroup.id;
        }

        closeModal();
        render();
      });
    }

          <button id="saveBtn" class="btn-primary" type="button">Dodaj</button>
        </div>
      `);

      const groupSelect = document.getElementById('bulkGroup');
      const subgroupSelect = document.getElementById('bulkSubgroup');

      fillGroupAndSubgroupSelects(groupSelect, subgroupSelect, getDefaultModalTarget());

      groupSelect.addEventListener('change', () => {
        fillSubgroupSelectForGroup(subgroupSelect, groupSelect.value, null);
      });

      bindModal('cancelBtn', 'click', closeModal);
      bindModal('saveBtn', 'click', () => {
        const raw = document.getElementById('bulkArea').value.trim();
        if (!raw) return alert('Wklej przynajmniej jedną linię.');

        const lines = raw.split('\n').map(x => x.trim()).filter(Boolean);
        const parsed = [];
        const errors = [];

        for (let i = 0; i < lines.length; i++) {
          const line = lines[i];
          const parts = line.split('|');
          if (parts.length < 2) {
            errors.push(`Linia ${i + 1}: brak separatora |`);
            continue;
          }
          const title = parts[0].trim();
          const url = parts.slice(1).join('|').trim();
          const validUrl = normalizeUrl(url);

          if (!title || !validUrl) {
            errors.push(`Linia ${i + 1}: niepoprawny tytuł lub URL`);
            continue;
          }

          parsed.push({ id: uid(), title, url: validUrl });
        }

        if (!parsed.length) {
          return alert(errors.join('\n') || 'Nie udało się dodać linków.');
        }

        const groupId = groupSelect.value;
        const subgroupId = subgroupSelect.value;

        if (groupId === OUTSIDE_GROUP_ID) {
          state.outsideLinks.push(...parsed);
          state.currentGroupId = OUTSIDE_GROUP_ID;
          state.currentSubgroupId = null;
        } else {
          const group = state.groups.find(g => g.id === groupId);
          const subgroup = group?.subgroups.find(s => s.id === subgroupId);
          if (!group || !subgroup) return;
          subgroup.links.push(...parsed);
          state.currentGroupId = group.id;
          state.currentSubgroupId = subgroup.id;
        }

        closeModal();
        render();

        if (errors.length) {
          setTimeout(() => alert(`Dodano ${parsed.length} linków.\n\nPominięto:\n${errors.join('\n')}`), 50);
        }
      });
    }

        ...state.groups.map(g =>
          `<option value="${g.id}" ${g.id === target.groupId ? 'selected' : ''}>${escapeHtml(g.name)}</option>`
        ),
        `<option value="${OUTSIDE_GROUP_ID}" ${target.groupId === OUTSIDE_GROUP_ID ? 'selected' : ''}>Poza grupami</option>`
      ].join('');

    function fillSubgroupSelectForGroup(subgroupSelect, groupId, selectedSubgroupId) {

      subgroupSelect.innerHTML = group.subgroups.map(s => `

      state.currentSubgroupId = null;
      render();
    }

    function duplicateLink(linkId) {
      const found = findLinkById(linkId);
      if (!found) return;

      const copy = {
        id: uid(),
        title: found.link.title + ' (kopia)',
        url: found.link.url
      };

      if (found.isOutside) {
        state.outsideLinks.push(copy);
        state.currentGroupId = OUTSIDE_GROUP_ID;
        state.currentSubgroupId = null;
      } else {
        const index = found.subgroup.links.findIndex(l => l.id === found.link.id);
        found.subgroup.links.splice(index + 1, 0, copy);
        state.currentGroupId = found.group.id;
        state.currentSubgroupId = found.subgroup.id;
      }

      render();
    }

    function removeLinkFromCurrentPlace(found) {
      if (found.isOutside) {
        state.outsideLinks = state.outsideLinks.filter(l => l.id !== found.link.id);

    function manualCopyFallback(text) {

    function exportState() {
      return {
        groups: state.groups,
        outsideLinks: state.outsideLinks,
        currentGroupId: state.currentGroupId === OUTSIDE_GROUP_ID && !hasOutsideLinks()
          ? state.groups[0]?.id || null
          : state.currentGroupId,
        currentSubgroupId: state.currentSubgroupId
      };
    }

    function findLinkById(linkId) {
      for (const link of state.outsideLinks) {
        if (link.id === linkId) {
          return { isOutside: true, link };
        }
      }

      for (const group of state.groups) {
        for (const subgroup of group.subgroups) {
          const link = subgroup.links.find(l => l.id === linkId);
          if (link) return { isOutside: false, group, subgroup, link };
        }
      }
      return null;
    }

    function reorderGroups(dragId, targetId, place) {
      if (dragId === OUTSIDE_GROUP_ID || targetId === OUTSIDE_GROUP_ID) return;
      const from = state.groups.findIndex(g => g.id === dragId);
      const to = state.groups.findIndex(g => g.id === targetId);
      if (from === -1 || to === -1 || from === to) return;

      const [moved] = state.groups.splice(from, 1);
      const newIndex = place === 'before' ? to : to + (from < to ? 0 : 1);
      state.groups.splice(Math.max(0, Math.min(newIndex, state.groups.length)), 0, moved);
      render();
    }

    function reorderSubgroups(dragId, targetId, place) {
      const group = getCurrentGroup();
      if (!group) return;
      const from = group.subgroups.findIndex(s => s.id === dragId);
      const to = group.subgroups.findIndex(s => s.id === targetId);
      if (from === -1 || to === -1 || from === to) return;

      const [moved] = group.subgroups.splice(from, 1);
      const newIndex = place === 'before' ? to : to + (from < to ? 0 : 1);
      group.subgroups.splice(Math.max(0, Math.min(newIndex, group.subgroups.length)), 0, moved);
      render();
    }

    function reorderLinks(dragId, targetId, place) {
      if (els.searchInput.value.trim()) {
        alert('Aby zmieniać kolejność linków, wyczyść wyszukiwanie.');
        return;
      }

      let list = null;

      if (isOutsideView()) {
        list = state.outsideLinks;
      } else {
        const subgroup = getCurrentSubgroup();
        if (!subgroup) return;
        list = subgroup.links;
      }

      const from = list.findIndex(l => l.id === dragId);
      const to = list.findIndex(l => l.id === targetId);
      if (from === -1 || to === -1 || from === to) return;

      const [moved] = list.splice(from, 1);
      const newIndex = place === 'before' ? to : to + (from < to ? 0 : 1);
      list.splice(Math.max(0, Math.min(newIndex, list.length)), 0, moved);
      render();
    }

    function normalizeUrl(url) {
      try {
        const prepared = /^(https?:)?\/\//i.test(url) ? url : `https://${url}`;
        return new URL(prepared).href;
      } catch {
        return null;
      }
    }

    function uid() {
      return (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Math.random().toString(36).slice(2) + Date.now());
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function escapeAttr(str) {
      return escapeHtml(str);
    }

    function attachTouchSortable({ element, type, container, onCommit }) {
      let holdTimer = null;
      let dragging = false;
      let pointerId = null;
      let startX = 0;
      let startY = 0;
      let currentX = 0;
      let currentY = 0;
      let shiftX = 0;
      let shiftY = 0;
      let clone = null;
      let placeholder = null;
      let startRect = null;
      let movedBeforeHold = false;
      let finalTargetId = null;
      let finalPlace = 'after';
      let intentLocked = false;
      let panDirection = null;

      const HOLD_MS = 320;
      const MOVE_CANCEL = 12;
      const DIRECTION_LOCK = 8;

      element.addEventListener('pointerdown', onPointerDown, { passive: true });
      element.addEventListener('dragstart', (e) => e.preventDefault());

      function onPointerDown(e) {
        if (e.pointerType === 'mouse' && e.button !== 0) return;
        if (e.target.closest('.menu-wrap')) return;
        if (type === 'link' && els.searchInput.value.trim()) return;
        if (element.dataset.id === OUTSIDE_GROUP_ID) return;

        pointerId = e.pointerId;
        startX = e.clientX;
        startY = e.clientY;
        currentX = e.clientX;
        currentY = e.clientY;
        movedBeforeHold = false;
        finalTargetId = null;
        finalPlace = 'after';
        startRect = element.getBoundingClientRect();
        intentLocked = false;
        panDirection = null;

        clearTimeout(holdTimer);
        holdTimer = setTimeout(beginDrag, HOLD_MS);

        window.addEventListener('pointermove', onPointerMove, { passive: false });
        window.addEventListener('pointerup', onPointerUp, { passive: false });
        window.addEventListener('pointercancel', onPointerCancel, { passive: false });
      }

      function onPointerMove(e) {
        if (e.pointerId !== pointerId) return;
        currentX = e.clientX;
        currentY = e.clientY;

        const dx = currentX - startX;
        const dy = currentY - startY;
        const adx = Math.abs(dx);
        const ady = Math.abs(dy);

        if (!intentLocked && (adx > DIRECTION_LOCK || ady > DIRECTION_LOCK)) {
          intentLocked = true;
          if (type === 'group' || type === 'subgroup') {
            panDirection = adx > ady ? 'x' : 'y';
          } else {
            panDirection = ady > adx ? 'y' : 'x';
          }
        }

        if (!dragging) {
          if ((panDirection === 'y' && ady > MOVE_CANCEL) || (panDirection === 'x' && adx > MOVE_CANCEL)) {
            movedBeforeHold = true;
            clearTimeout(holdTimer);
            cleanup();
            return;
          }
          return;
        }

        e.preventDefault();
        element.dataset.dragging = '1';
        moveClone(currentX, currentY);
        updatePlaceholderPosition();
        animateSiblings();
        autoScroll();
      }

      function onPointerUp(e) {
        if (e.pointerId !== pointerId) return;
        clearTimeout(holdTimer);

        if (dragging) {
          e.preventDefault();
          finishDrag(true);
        } else {
          cleanup();
          setTimeout(() => { element.dataset.dragging = '0'; }, 0);
        }
      }

      function onPointerCancel(e) {
        if (e.pointerId !== pointerId) return;
        clearTimeout(holdTimer);

        if (dragging) {
          finishDrag(false);
        } else {
          cleanup();
          element.dataset.dragging = '0';
        }
      }

      function beginDrag() {
        if (movedBeforeHold) return;
        dragging = true;
        element.dataset.dragging = '1';
        closeAllMenus();

        if (navigator.vibrate) navigator.vibrate(16);

        try {
          if (window.getSelection) {
            const selection = window.getSelection();
            if (selection) selection.removeAllRanges();
          }
        } catch {}

        placeholder = document.createElement('div');
        placeholder.className = 'placeholder' + (type === 'group' || type === 'subgroup' ? ' tab' : '');
        placeholder.style.height = `${startRect.height}px`;
        placeholder.style.width = `${startRect.width}px`;

        element.parentNode.insertBefore(placeholder, element);
        element.style.visibility = 'hidden';

        clone = buildClone();
        els.dragLayer.innerHTML = '';
        els.dragLayer.appendChild(clone);

        shiftX = startX - startRect.left;
        shiftY = startY - startRect.top;
        moveClone(currentX, currentY);
      }

      function buildClone() {
        const div = document.createElement('div');
        div.className = 'drag-clone ' + (type === 'link' ? 'link' : 'tab');
        div.style.setProperty('--clone-width', `${startRect.width}px`);

        if (type === 'link') {
          const title = element.querySelector('.link-title')?.textContent || '';
          const favEl = element.querySelector('.favicon');
          const fav = favEl ? favEl.cloneNode(true) : document.createElement('div');
          fav.classList.add('favicon');

          const text = document.createElement('div');
          text.className = 'link-title';
          text.textContent = title;

          const menu = document.createElement('div');
          menu.className = 'menu-btn';
          menu.innerHTML = '<span>⋯</span>';

          div.appendChild(fav);
          div.appendChild(text);
          div.appendChild(menu);
        } else {
          div.textContent = element.textContent;
        }

        return div;
      }

      function moveClone(x, y) {
        if (!clone) return;
        clone.style.transform = `translate3d(${x - shiftX}px, ${y - shiftY}px, 0) scale(1.02)`;
      }

      function updatePlaceholderPosition() {
        const siblings = [...container.children].filter(el => el !== element && el !== placeholder);
        if (!siblings.length) return;

        let inserted = false;

        for (const sib of siblings) {
          const rect = sib.getBoundingClientRect();

          if (type === 'group' || type === 'subgroup') {
            const mid = rect.left + rect.width / 2;
            if (currentX < mid) {
              container.insertBefore(placeholder, sib);
              finalTargetId = sib.dataset.id;
              finalPlace = 'before';
              inserted = true;
              break;
            }
          } else {
            const mid = rect.top + rect.height / 2;
            if (currentY < mid) {
              container.insertBefore(placeholder, sib);
              finalTargetId = sib.dataset.id;
              finalPlace = 'before';
              inserted = true;
              break;
            }
          }
        }

        if (!inserted) {
          container.appendChild(placeholder);
          const last = siblings[siblings.length - 1];
          finalTargetId = last?.dataset.id || null;
          finalPlace = 'after';
        }
      }

      function animateSiblings() {
        const items = [...container.children].filter(el => el !== placeholder && el !== element);
        items.forEach(el => el.classList.add('sort-animate'));
      }

      function finishDrag(commit) {
        if (clone) clone.remove();
        if (placeholder && placeholder.parentNode) {
          placeholder.parentNode.insertBefore(element, placeholder);
          placeholder.remove();
        }

        element.style.visibility = '';
        const dragId = element.dataset.id;

        cleanup();

        if (commit && finalTargetId && finalTargetId !== dragId) {
          onCommit(dragId, finalTargetId, finalPlace);
        } else {
          render();
        }
      }

      function cleanup() {
        dragging = false;
        pointerId = null;
        clone = null;
        placeholder = null;
        startRect = null;
        clearTimeout(holdTimer);
        window.removeEventListener('pointermove', onPointerMove);
        window.removeEventListener('pointerup', onPointerUp);
        window.removeEventListener('pointercancel', onPointerCancel);
        setTimeout(() => { element.dataset.dragging = '0'; }, 0);
      }

      function autoScroll() {
        const marginY = 90;
        const speedY = 10;
        const vh = window.innerHeight;

        if (currentY < marginY) window.scrollBy(0, -speedY);
        if (currentY > vh - marginY) window.scrollBy(0, speedY);

        if (type === 'group' || type === 'subgroup') {
          const rect = container.getBoundingClientRect();
          if (currentX < rect.left + 50) container.scrollLeft -= 12;
          if (currentX > rect.right - 50) container.scrollLeft += 12;
        }
      }
    }
  </script>
</body>
